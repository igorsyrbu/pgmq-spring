spring:
  application:
    name: pgmq-quickstart-batch-sample
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  sql:
    init:
      mode: always

# Everything pgmq-spring needs: point it at a database and name the queues.
pgmq:
  queues:
    - name: readings
    - name: readings_dlq
  producer:
    # A sendBatch longer than this becomes several statements - still all-or-nothing.
    max-batch-size: 500
  health:
    queues:
      - readings
  metrics:
    queues:
      - readings

logging:
  level:
    io.github.pgmqspring: INFO
