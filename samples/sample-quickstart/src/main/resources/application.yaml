spring:
  application:
    name: pgmq-quickstart-sample
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  sql:
    init:
      mode: always

# Everything pgmq-spring needs: point it at a database and name the queues.
pgmq:
  queues:
    - name: orders
    - name: orders_dlq
  health:
    queues:
      - orders
  metrics:
    queues:
      - orders


logging:
  level:
    io.github.pgmqspring: INFO
