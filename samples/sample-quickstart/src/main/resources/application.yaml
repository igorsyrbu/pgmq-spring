spring:
  application:
    name: pgmq-quickstart-sample
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  sql:
    init:
      mode: always

# Everything pgmq-spring needs: point it at a database and name the queues.
pgmq:
  queues:
    - name: orders
    - name: orders_dlq
    - name: order_notifications
      # PGMQ notifies on every insert, which the notification consumer waits for (PGMQ 1.10+).
      notify-on-insert: true
  producer:
    # Every message this application sends carries these, unless a send sets its own.
    default-headers:
      source: quickstart-sample
  # Defaults for containers built from the ConsumerOptions bean - here the notification consumer.
  consumer:
    # One delete per polled batch instead of one per message. Not for transactional consumers.
    batch-acknowledgements: true
    # Wake up on PGMQ's insert notifications; the regular poll becomes a 30s fallback.
    wake-up: notify
    max-poll-delay: 30s
  health:
    queues:
      - orders
  metrics:
    queues:
      - orders


logging:
  level:
    io.github.pgmqspring: INFO
