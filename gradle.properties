# --- Project coordinates -------------------------------------------------
# Local builds publish under these; a JitPack build overrides both from the
# tag and the GitHub account (see jitpack.yml).
group=io.github.igorsyrbu.pgmq
version=0.1.0-SNAPSHOT
# The GitHub repository, used for the POM's url, scm and issue links.
repositoryUrl=https://github.com/igorsyrbu/pgmq-spring

# --- Spring baselines ----------------------------------------------------
# The library compiles against the oldest Boot minor still in OSS support
# (4.0.x), so it runs on every supported minor; test the others with
# -PspringBootVersion=...
#   Boot 4.1.x  OSS support until 2027-07-31
#   Boot 4.0.x  OSS support until 2026-12-31   <- compile baseline
springBootVersion=4.0.8

# --- Build behaviour -----------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
